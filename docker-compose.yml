# MyNotes – lokales Entwicklungs-Setup.
# Produktion: separates Deployment, www/ wird auf den vServer kopiert.

services:
  db:
    image: mariadb:11.7
    command: >
      --innodb-buffer-pool-size=512M
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: mynotes
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks: [mynet]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./www/backend
    volumes:
      - ./www/backend:/app
      - ./www/data/assets:/app/data/assets
    environment:
      DB_URL: "mysql+asyncmy://app:app@db:3306/mynotes"
      JWT_SECRET: "dev-secret-change-me"
      ASSET_DIR: "/app/data/assets"
      BOOTSTRAP_ADMIN_EMAIL: "admin@mynotes.localhost"
      BOOTSTRAP_ADMIN_PASSWORD: "admin"
      CORS_ORIGINS: "https://mynotes.localhost,http://localhost:5173"
      DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mynotes-api.rule=Host(`api.mynotes.localhost`)"
      - "traefik.http.routers.mynotes-api.tls=true"
      - "traefik.http.services.mynotes-api.loadbalancer.server.port=8000"
    networks: [mynet]

  frontend:
    build:
      context: ./www/frontend
    volumes:
      - ./www/frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_BASE: "https://api.mynotes.localhost"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mynotes.rule=Host(`mynotes.localhost`)"
      - "traefik.http.routers.mynotes.tls=true"
      - "traefik.http.services.mynotes.loadbalancer.server.port=5173"
    networks: [mynet]

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mynotes-pma.rule=Host(`phpmyadmin.mynotes.localhost`)"
      - "traefik.http.routers.mynotes-pma.tls=true"
    networks: [mynet]

  traefik:
    image: traefik:v3.6
    user: root
    command:
      - --log.level=INFO
      - --entrypoints.web.address=:80
      - --entrypoints.web-secure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/config/static.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/config/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "./traefik/certs:/etc/certs:ro"
    networks:
      mynet:
        aliases:
          - mynotes.localhost
          - api.mynotes.localhost
          - phpmyadmin.mynotes.localhost

networks:
  mynet:
    driver: bridge

volumes:
  db-data:
  frontend-node-modules:
