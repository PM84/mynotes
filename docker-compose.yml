version: "3.6"
services:
    www:
        build: .
        volumes:
            - ./www:/var/www/html/
        environment:
            UPLOAD_LIMIT: 64M
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.webserver.rule=Host(`website.localhost`)"
            - "traefik.http.routers.webserver.tls=true"
        networks:
            mynet:
    db:
        image: mysql:5.7
        environment:
            MYSQL_DATABASE: myDb
            MYSQL_USER: user
            MYSQL_PASSWORD: test
            MYSQL_ROOT_PASSWORD: test
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - ./dump:/docker-entrypoint-initdb.d
            - ./docker/mysql:/var/lib/mysql
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            mynet:
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        links:
            - db:db
        environment:
            MYSQL_USER: user
            MYSQL_PASSWORD: test
            MYSQL_ROOT_PASSWORD: test
            # PMA_ARBITRARY: 1 #Wenn gesetzt kann man vor dem Login zuerst die DB auswählen
            PMA_HOST: db
            PMA_ABSOLUTE_URI: https://phpmyadmin.localhost
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.localhost`)"
            - "traefik.http.routers.phpmyadmin.tls=true"
        networks:
            mynet:
    traefik:
        image: "traefik:latest"
        command:
            - --log.level=DEBUG
            - --entrypoints.web.address=:80
            - --entrypoints.web-secure.address=:443
            - --serverstransport.insecureskipverify=true
        ports:
            - "80:80"
            - "8080:8080"
            - "443:443"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
            - "./traefik/config/static.yml:/etc/traefik/traefik.yml:ro"
            - "./traefik/config/dynamic.yml:/etc/traefik/dynamic.yml:ro"
            - "./traefik/certs:/etc/certs:ro"
        networks:
            mynet:
                aliases:
                    - website.localhost
                    - phpmyadmin.localhost
networks:
    mynet:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 192.168.159.0/24